name: Construir APK de prueba

# Se ejecuta cuando subes cambios a la rama main (o a mano desde Actions).
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/apk.yml'
      - '.github/scripts/make_icons.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      # La carpeta android se crea aquí cada vez, no se guarda en el repositorio.
      - name: Crear proyecto Android
        run: npx cap add android

      # Cambia el icono de Capacitor por el de EcoPuntos (usa www/icons/icon-512.png)
      - name: Icono de la app
        run: |
          pip install pillow
          python3 .github/scripts/make_icons.py

      - name: Permisos de GPS y cámara
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MANIFEST"
          grep -q ACCESS_FINE_LOCATION "$MANIFEST" || { echo "No se pudieron agregar los permisos"; exit 1; }
          grep -n "uses-permission\|uses-feature" "$MANIFEST"

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Construir APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: EcoPuntos-APK-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
